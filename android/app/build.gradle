apply plugin: 'com.android.application'

// The version lives in www/js/version.js, which save.bat stamps on every commit,
// so the app's About line and the APK can never disagree. versionCode is the
// commit count: Android refuses an update whose versionCode doesn't grow.
def versionText = file('../../www/js/version.js').text
def versionMatch = versionText =~ /count:\s*(\d+),\s*label:\s*"([^"]*)"/
if (!versionMatch.find()) throw new GradleException('www/js/version.js has no count/label')
def appVersionCode = Math.max(1, versionMatch.group(1) as int)
def appVersionName = versionMatch.group(2)

// The release key. CI writes it from the repository secrets and names it in
// HORSE_KEYSTORE; locally, android/keystore.properties (gitignored, made by
// tools/keystore.ps1) points at it. Keep the SAME keystore forever: Android
// refuses an update signed with another key.
def keystoreProps = new Properties()
def keystorePropsFile = file('../keystore.properties')
if (keystorePropsFile.isFile()) keystorePropsFile.withInputStream { keystoreProps.load(it) }
def releaseStore = System.getenv('HORSE_KEYSTORE') ?: keystoreProps.getProperty('storeFile')

android {
    namespace = "com.horsetinder.app"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.horsetinder.app"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        versionCode appVersionCode
        versionName appVersionName
        // Turns the updater on (UpdatePlugin.java). Only signed release builds pass
        // -PhorseUpdateFeed, so a debug build never checks and never goes online.
        buildConfigField "String", "UPDATE_FEED", "\"${project.findProperty('horseUpdateFeed') ?: ''}\""
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    buildFeatures {
        buildConfig true
    }
    signingConfigs {
        release {
            if (releaseStore) {
                storeFile file(releaseStore)
                storePassword System.getenv('HORSE_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('storePassword')
                keyAlias System.getenv('HORSE_KEY_ALIAS') ?: keystoreProps.getProperty('keyAlias')
                keyPassword System.getenv('HORSE_KEY_PASSWORD') ?: System.getenv('HORSE_KEYSTORE_PASSWORD') ?: keystoreProps.getProperty('keyPassword')
            }
        }
    }
    buildTypes {
        release {
            if (releaseStore) signingConfig signingConfigs.release
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
