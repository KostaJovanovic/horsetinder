# Release: build the signed APK on GitHub and publish it where the app's
# updater looks. Started by save.bat (menu: release) once the push is in, or by
# hand from the Actions tab. A port of mbrd's release.yml, Android only.
#
# The releases live in KostaJovanovic/horsetinder-release, not here. This repo
# is private, and GitHub answers a private repo's releases with a 404 to
# anybody signed out - which is every phone. The updater (UpdatePlugin.java)
# asks that repo's API for the latest release and finds the APK by the part of
# its name before the version, so keep "horsetinder-android-" exactly as it is.
# There is no update file: the API answer carries the download URL and the
# SHA-256 digest GitHub computed, and the app refuses a file without one.
#
# Secrets, set by the maintainer (tools\keystore.ps1 sets the three ANDROID_
# ones; README.md has the steps):
#   RELEASES_TOKEN             a fine-grained token for horsetinder-release
#                              only, Contents read and write. The job's own
#                              GITHUB_TOKEN cannot write to another repo.
#   ANDROID_KEYSTORE_BASE64    the release keystore, base64
#   ANDROID_KEYSTORE_PASSWORD  its password, also the key's
#   ANDROID_KEY_ALIAS          the key alias
# Keep the SAME keystore forever: Android refuses an update signed with
# another key, and a local signed build uses it too.
name: Release app

on:
  workflow_dispatch:
    inputs:
      # Untick for a test build: the draft gets the real APK and stays a draft,
      # so you can download and try it, and no installed app sees an update.
      publish:
        description: Publish the release
        type: boolean
        default: true

# Two runs at once would race to create the same release.
concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: write

env:
  RELEASE_REPO: KostaJovanovic/horsetinder-release

jobs:
  android:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      # Gradle needs JDK 21 for Capacitor 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: gradle

      # One source for the version: www/js/version.js, stamped by save.bat and
      # read by build.gradle for versionCode/versionName.
      - name: Read the version
        id: v
        run: |
          node -e '
            const t = require("fs").readFileSync("www/js/version.js", "utf8");
            const m = /count:\s*(\d+),\s*label:\s*"([^"]*)"/.exec(t);
            if (!m) { console.error("no version in www/js/version.js"); process.exit(1); }
            console.log("count=" + m[1]); console.log("label=" + m[2]);
          ' | tee -a "$GITHUB_OUTPUT"

      - name: Sync the Android project
        run: |
          npm ci
          npx cap sync android

      - name: Write the keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error title=No keystore::Set ANDROID_KEYSTORE_BASE64, ANDROID_KEYSTORE_PASSWORD and ANDROID_KEY_ALIAS on this repo. save.bat, menu keystore, does it."
            exit 1
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "HORSE_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      # -PhorseUpdateFeed turns the updater on. Written out, because
      # github.repository is this private one.
      - name: Build the signed APK
        working-directory: android
        env:
          HORSE_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          HORSE_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease \
            -PhorseUpdateFeed=https://api.github.com/repos/${{ env.RELEASE_REPO }}/releases/latest

      - name: Name the APK
        env:
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/app-release.apk "out/horsetinder-android-$LABEL.apk"
          rm -f "$RUNNER_TEMP/release.jks"

      # Kept on the run too, so a test build can be downloaded from the Actions tab.
      - uses: actions/upload-artifact@v4
        with:
          name: horsetinder-android-${{ steps.v.outputs.label }}
          path: out/*.apk
          retention-days: 14

      # A draft is invisible to the updater, so it can be filled without any
      # installed app seeing a half-made release. Publishing flips it.
      - name: Upload into the draft release
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN:-}" ]; then
            echo "::error title=No RELEASES_TOKEN::Set RELEASES_TOKEN: a fine-grained token for $RELEASE_REPO only, Contents read and write. gh secret set RELEASES_TOKEN -R ${{ github.repository }}"
            exit 1
          fi
          tag="v$LABEL"
          if ! gh release view "$tag" -R "$RELEASE_REPO" >/dev/null 2>&1; then
            gh release create "$tag" -R "$RELEASE_REPO" --draft --title "Horse Tinder $LABEL" --notes "Building." --target main
          fi
          gh release upload "$tag" "out/horsetinder-android-$LABEL.apk" -R "$RELEASE_REPO" --clobber

      - name: Publish the release
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.RELEASES_TOKEN }}
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          set -euo pipefail
          tag="v$LABEL"
          cat > notes.md <<EOF
          Horse Tinder $LABEL for Android 7 and later: [horsetinder-android-$LABEL.apk](https://github.com/$RELEASE_REPO/releases/download/$tag/horsetinder-android-$LABEL.apk)

          Installed copies see this version at their next start and show an **Update** button next to the logo.
          For a first install, allow your browser or file manager to install apps when Android asks.

          Built from commit $GITHUB_SHA.
          EOF
          gh release edit "$tag" -R "$RELEASE_REPO" --title "Horse Tinder $LABEL" --notes-file notes.md --draft=false --latest

      # The tag that ties the release to its source, in this repo.
      - name: Tag the source commit
        if: ${{ inputs.publish }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LABEL: ${{ steps.v.outputs.label }}
        run: |
          tag="v$LABEL"
          if gh api "repos/${{ github.repository }}/git/ref/tags/$tag" >/dev/null 2>&1; then
            echo "$tag already exists here, left as it is"
          else
            gh api "repos/${{ github.repository }}/git/refs" -f "ref=refs/tags/$tag" -f "sha=$GITHUB_SHA"
          fi
